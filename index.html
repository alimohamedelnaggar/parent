<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الحضور والانصراف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#f7f9fb;--card:#fff;--ink:#25303b;--mute:#6a7685;--line:#e1e7ee;--pri:#4a6fa5;--pri-s:#e9eff7;--ok:#3f7a5e;--ok-s:#e6f0ea;--no:#a8456a;--no-s:#fdeaf1;--err:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a21;--card:#1b222b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2c3541;--pri:#8fb0e0;--pri-s:#222d3d;--ok:#6fdca1;--ok-s:#173325;--no:#f2a3c0;--no-s:#3a1f2c}}
:root[data-theme="dark"]{--bg:#151a21;--card:#1b222b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2c3541;--pri:#8fb0e0;--pri-s:#222d3d;--ok:#6fdca1;--ok-s:#173325;--no:#f2a3c0;--no-s:#3a1f2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Cairo,Tajawal,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(40,60,90,.07)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.std{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.std input{width:64px;height:34px;text-align:center}
form.card{padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.calc{height:42px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--pri-s);font-weight:600}
.err{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}
.btn{height:42px;border:0;border-radius:10px;background:var(--pri);color:#fff;text-shadow:0 0 1px rgba(0,0,0,.25);font:600 15px Cairo,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;cursor:pointer}
.btn.sec{background:var(--pri-s);color:var(--pri)}
.btn.danger{background:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sum div{padding:10px 14px}
.sum small{display:block;color:var(--mute);font-size:12px}
.sum b{font-size:18px}
.filter{display:flex;gap:10px;align-items:end;margin-bottom:12px;flex-wrap:wrap}
.filter>div{width:150px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);background:var(--pri-s);font-weight:600}
tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.no{background:var(--no-s);color:var(--no)}
.act{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);display:grid;place-items:center;cursor:pointer}
.ib:hover{color:var(--pri);border-color:var(--pri)}.ib.d:hover{color:var(--err);border-color:var(--err)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.empty svg{width:36px;height:36px;color:var(--pri);margin-bottom:6px}
.pg{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;color:#fff;font-weight:600;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(20,15,40,.45);display:none;place-items:center;z-index:8;padding:16px}
#modal .card{padding:20px;max-width:340px;width:100%}
#modal .row{display:flex;gap:8px;margin-top:14px}
@media(max-width:640px){
main{padding:14px 12px 40px}
h1{font-size:19px}
header{flex-direction:column;align-items:stretch;gap:8px}
.std{justify-content:space-between}
form.card{padding:14px}
.grid{grid-template-columns:1fr 1fr;gap:10px}
.grid>div:first-child,.grid>div:last-child{grid-column:1/-1}
input,select{height:46px;font-size:16px}
.btn{height:46px}
.sum{grid-template-columns:1fr 1fr;gap:8px}
.sum div{padding:8px 12px}
.filter>div{flex:1;width:auto}
.wrap{overflow:visible}
table,tbody{display:block;width:100%;min-width:0}
thead{display:none}
tr{display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-areas:"a b o" "i x w" "z z z";gap:8px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
tr:last-child{border-bottom:0}
td{display:block;padding:0;border:0;white-space:normal}
td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute)}
td:nth-child(1){grid-area:a;font-weight:700}td:nth-child(2){grid-area:b;font-weight:700}td:nth-child(3){grid-area:i}td:nth-child(4){grid-area:x}td:nth-child(5){grid-area:w}td:nth-child(6){grid-area:o}
td:last-child{grid-area:z;padding-top:6px}
td:last-child::before{display:none}
.act{gap:8px}
.ib{flex:1;width:auto;height:44px}
button,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pg{padding:12px 14px}.pg .btn{flex:1}
.std label{font-size:12px}
.err{min-height:0}
#modal{place-items:end center;padding:0}
#modal .card{max-width:none;border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#modal .btn{height:48px}
#toast{width:calc(100% - 32px);text-align:center}
}
</style>
</head>
<body>
<main>
<header>
  <h1>تسجيل الحضور والانصراف</h1>
  <div class="std"><label for="std" style="margin:0">ساعات العمل القياسية يوميًا</label><input id="std" type="number" min="1" max="24" step="0.25"></div>
</header>

<form class="card" id="form" novalidate>
  <div class="grid">
    <div><label for="date">التاريخ</label><input id="date" type="date" required></div>
    <div><label for="in">وقت الحضور</label><input id="in" type="time" required></div>
    <div><label for="out">وقت الانصراف</label><input id="out" type="time" required></div>
    <div><label>ساعات العمل</label><div class="calc" id="wk">—</div></div>
    <div><label>الساعات الإضافية</label><div class="calc" id="ot">—</div></div>
    <div style="display:flex;gap:8px"><button class="btn" id="save" type="submit" style="flex:1"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="saveTxt">إضافة تسجيل</span></button><button class="btn sec" id="cancel" type="button" style="display:none">إلغاء</button></div>
  </div>
  <div class="err" id="err" role="alert"></div>
</form>

<section class="sum" id="sum"></section>

<div class="filter">
  <div><label for="fm">الشهر</label><select id="fm"></select></div>
  <div><label for="fy">السنة</label><select id="fy"></select></div>
</div>

<div class="card">
  <div class="wrap"><table>
    <thead><tr><th>اليوم</th><th>التاريخ</th><th>وقت الحضور</th><th>وقت الانصراف</th><th>ساعات العمل</th><th>ساعات إضافية</th><th>الإجراءات</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="empty" class="empty" style="display:none"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div>لا توجد تسجيلات في هذه الفترة. أضف أول تسجيل من النموذج أعلاه.</div></div>
  <div class="pg" id="pg" style="display:none"><button class="btn sec" id="next">السابق</button><span id="pn"></span><button class="btn sec" id="prev">التالي</button></div>
</div>
<p style="color:var(--mute);font-size:12px;margin-top:12px">نسخة تجريبية: تُحفظ البيانات في متصفحك فقط (localStorage) على هذا الجهاز.</p>
</main>

<div id="toast"></div>
<div id="modal"><div class="card"><b>حذف التسجيل</b><p style="color:var(--mute);margin:6px 0 0" id="mt"></p><div class="row"><button class="btn danger" id="yes" style="flex:1">حذف</button><button class="btn sec" id="no" style="flex:1">إلغاء</button></div></div></div>

<script>
const $=id=>document.getElementById(id), KEY='attendance.records.v1', SKEY='attendance.stdMinutes.v1', PER=10;
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let recs=[],stdMin=480,editId=null,page=1,delId=null;
try{recs=JSON.parse(localStorage.getItem(KEY)||'[]');stdMin=+localStorage.getItem(SKEY)||480}catch(e){recs=[]}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs));localStorage.setItem(SKEY,stdMin);return true}catch(e){return false}};
const toMin=t=>{const m=/^(\d{2}):(\d{2})$/.exec(t||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null};
const calc=(a,b)=>{const w=b-a;return{w,o:Math.max(0,w-stdMin)}};
const fmtD=m=>{const h=Math.floor(m/60),r=m%60;return h&&r?`${h} س ${r} د`:h?`${h} س`:`${r} د`};
const fmtT=t=>{const m=toMin(t),h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return`${h%12||12}:${mm} ${h<12?'ص':'م'}`};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>{const d=pd(s);return`${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`};
function toast(msg,bad){const t=$('toast');t.textContent=msg;t.style.background=bad?'#b5503f':'#4a6fa5';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

function live(){const a=toMin($('in').value),b=toMin($('out').value);
  if(a===null||b===null||b<=a){$('wk').textContent='—';$('ot').textContent='—';return}
  const r=calc(a,b);$('wk').textContent=fmtD(r.w);$('ot').textContent=fmtD(r.o)}

function fillFilters(sel){
  const ys=new Set(recs.map(r=>pd(r.date).getFullYear()));ys.add(new Date().getFullYear());
  const cm=sel?sel.m:$('fm').value||String(new Date().getMonth()+1),cy=sel?sel.y:$('fy').value||String(new Date().getFullYear());
  $('fm').innerHTML='<option value="0">كل الشهور</option>'+MN.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
  $('fy').innerHTML=[...ys].sort((a,b)=>b-a).map(y=>`<option>${y}</option>`).join('');
  $('fm').value=cm;$('fy').value=cy}

function render(){
  const m=+$('fm').value,y=+$('fy').value;
  const list=recs.filter(r=>{const d=pd(r.date);return d.getFullYear()===y&&(m===0||d.getMonth()+1===m)}).sort((a,b)=>b.date.localeCompare(a.date));
  const tw=list.reduce((s,r)=>s+r.workingMinutes,0),to=list.reduce((s,r)=>s+r.overtimeMinutes,0);
  $('sum').innerHTML=[['أيام الحضور',list.length+' يوم'],['إجمالي ساعات العمل',fmtD(tw)],['إجمالي الساعات الإضافية',fmtD(to)],['تسجيلات '+(m?MN[m-1]:'السنة'),list.length]].map(c=>`<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('');
  const pages=Math.max(1,Math.ceil(list.length/PER));page=Math.min(page,pages);
  const part=list.slice((page-1)*PER,page*PER);
  $('rows').innerHTML=part.map(r=>`<tr><td data-l="اليوم">${DN[pd(r.date).getDay()]}</td><td data-l="التاريخ">${fmtDate(r.date)}</td><td data-l="وقت الحضور">${fmtT(r.checkInTime)}</td><td data-l="وقت الانصراف">${fmtT(r.checkOutTime)}</td><td data-l="ساعات العمل">${fmtD(r.workingMinutes)}</td><td data-l="ساعات إضافية"><span class="badge ${r.overtimeMinutes?'ok':'no'}">${fmtD(r.overtimeMinutes)}</span></td><td data-l="الإجراءات"><div class="act"><button class="ib" data-e="${r.id}" aria-label="تعديل"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button><button class="ib d" data-d="${r.id}" aria-label="حذف"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button></div></td></tr>`).join('');
  $('empty').style.display=list.length?'none':'block';
  $('pg').style.display=pages>1?'flex':'none';$('pn').textContent=`${page} / ${pages}`;
  $('next').disabled=page<=1;$('prev').disabled=page>=pages}

function reset(){editId=null;$('form').reset();$('date').value=today();$('saveTxt').textContent='إضافة تسجيل';$('cancel').style.display='none';$('err').textContent='';live()}

$('form').addEventListener('submit',e=>{
  e.preventDefault();const date=$('date').value,i=$('in').value,o=$('out').value,a=toMin(i),b=toMin(o);
  const bad=m=>{$('err').textContent=m;toast(m,true)};
  if(!date)return bad('اختر التاريخ.');
  if(a===null)return bad('أدخل وقت حضور صحيحًا.');
  if(b===null)return bad('أدخل وقت انصراف صحيحًا.');
  if(b<=a)return bad('يجب أن يكون وقت الانصراف بعد وقت الحضور.');
  if(recs.some(r=>r.date===date&&r.id!==editId))return bad('يوجد تسجيل لهذا التاريخ بالفعل. عدّله من الجدول.');
  const c=calc(a,b),now=new Date().toISOString();
  if(editId){const r=recs.find(x=>x.id===editId);Object.assign(r,{date,checkInTime:i,checkOutTime:o,workingMinutes:c.w,overtimeMinutes:c.o,updatedAt:now})}
  else recs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,checkInTime:i,checkOutTime:o,workingMinutes:c.w,overtimeMinutes:c.o,createdAt:now,updatedAt:now});
  if(!store())return bad('تعذّر الحفظ في المتصفح.');
  const d=pd(date);fillFilters({m:String(d.getMonth()+1),y:String(d.getFullYear())});
  toast(editId?'تم تحديث التسجيل':'تمت إضافة التسجيل');reset();page=1;render()});

$('rows').addEventListener('click',e=>{
  const eb=e.target.closest('[data-e]'),db=e.target.closest('[data-d]');
  if(eb){const r=recs.find(x=>x.id===eb.dataset.e);editId=r.id;$('date').value=r.date;$('in').value=r.checkInTime;$('out').value=r.checkOutTime;$('saveTxt').textContent='حفظ التعديل';$('cancel').style.display='';$('err').textContent='';live();scrollTo({top:0,behavior:'smooth'})}
  if(db){const r=recs.find(x=>x.id===db.dataset.d);delId=r.id;$('mt').textContent=`هل تريد حذف تسجيل ${fmtDate(r.date)}؟ لا يمكن التراجع عن ذلك.`;$('modal').style.display='grid';$('no').focus()}});
$('no').onclick=()=>{$('modal').style.display='none';delId=null};
$('yes').onclick=()=>{recs=recs.filter(r=>r.id!==delId);store();if(editId===delId)reset();$('modal').style.display='none';delId=null;toast('تم حذف التسجيل');render()};
$('cancel').onclick=reset;
['in','out'].forEach(k=>$(k).addEventListener('input',live));
['fm','fy'].forEach(k=>$(k).addEventListener('change',()=>{page=1;render()}));
$('next').onclick=()=>{page--;render()};$('prev').onclick=()=>{page++;render()};
$('std').value=stdMin/60;
$('std').addEventListener('change',()=>{const v=parseFloat($('std').value);
  if(!(v>0&&v<=24)){$('std').value=stdMin/60;return toast('أدخل عدد ساعات بين 1 و24',true)}
  stdMin=Math.round(v*60);recs.forEach(r=>r.overtimeMinutes=Math.max(0,r.workingMinutes-stdMin));store();live();render();toast('تم تحديث ساعات العمل القياسية')});

fillFilters();reset();render();
</script>
</body>
</html>
